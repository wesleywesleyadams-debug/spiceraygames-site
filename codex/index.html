<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aegis Matrix Codex</title>
<meta name="description" content="The in-game Codex for Aegis Matrix, a pixel-art space RTS by Spiceray Games.">
<style>
@font-face{font-family:"JBM";src:url(../assets/JetBrainsMono.ttf) format("truetype");font-display:swap}
:root{--bg:#080912;--panel:#0c0e1f;--line:#2b3a6b;--accent:#4fb4ff;--text:#c3cde4;--dim:#6a7596;--warm:#f2a65a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 "JBM",ui-monospace,monospace}
a{color:var(--accent)}
img{image-rendering:pixelated;image-rendering:crisp-edges;max-width:100%;height:auto}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-bottom:2px solid var(--line)}
header a.home{color:var(--warm);font-weight:700;letter-spacing:.15em;text-transform:uppercase;text-decoration:none}
header .t{color:var(--accent);text-transform:uppercase;letter-spacing:.15em}
#menu{display:none;background:var(--panel);color:var(--accent);border:2px solid var(--line);font:inherit;padding:4px 10px}
.layout{display:grid;grid-template-columns:240px 1fr;max-width:1200px;margin:0 auto}
nav{border-right:2px solid var(--line);padding:12px 0;max-height:calc(100vh - 52px);overflow:auto;position:sticky;top:0}
nav .sec{display:block;padding:6px 16px;color:var(--warm);text-decoration:none;text-transform:uppercase;letter-spacing:.08em;font-size:.85rem;margin-top:6px}
nav .sub{display:block;padding:3px 16px 3px 28px;color:var(--text);text-decoration:none;font-size:.85rem}
nav a:hover{color:var(--accent)}
nav a.on{background:#141a36;color:var(--accent)}
main{padding:16px 24px 64px;min-width:0}
main h1{color:var(--accent);text-transform:uppercase;letter-spacing:.12em;font-size:1.2rem;border-bottom:2px solid var(--line);padding-bottom:8px}
main h2{color:var(--warm);font-size:1rem;margin:24px 0 6px}
main p{margin:6px 0;max-width:72ch}
.fig{background:var(--panel);border:2px solid var(--line);padding:12px;margin:12px 0;display:inline-block;max-width:100%}
.spr{display:inline-block;vertical-align:middle;margin:4px 8px 4px 0}
.next{margin-top:32px;display:flex;justify-content:space-between;gap:12px;border-top:2px solid var(--line);padding-top:12px}
footer{border-top:2px solid var(--line);padding:16px;text-align:center;color:var(--dim);font-size:.8rem}
@media (max-width:760px){
 .layout{grid-template-columns:1fr}
 #menu{display:inline-block}
 nav{display:none;position:static;max-height:none;border-right:0;border-bottom:2px solid var(--line)}
 nav.open{display:block}
 main{padding:12px 16px 48px}
}
</style>
</head>
<body>
<header>
  <a class="home" href="../">Spiceray Games</a>
  <span class="t">Aegis Matrix Codex</span>
  <button id="menu" aria-expanded="false">Menu</button>
</header>
<div class="layout">
  <nav id="nav"></nav>
  <main id="page"><p>Loading…</p></main>
</div>
<footer>
  <p>Work in progress: details may change before release.</p>
  <p>&copy; 2026 Wesley Adams. All rights reserved.</p>
</footer>
<script>
const SKIP_TEXT = /^(Not available yet\.*…?|BASIC|ADVANCED|EXPERIMENTAL)$/;
let pages = [];
const nav = document.getElementById('nav'), main = document.getElementById('page'), menu = document.getElementById('menu');
menu.onclick = () => { const o = nav.classList.toggle('open'); menu.setAttribute('aria-expanded', o); };

function esc(s){ return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

async function init(){
  const idx = await (await fetch('data/index.json')).json();
  // Drop pages that are only a heading
  const checks = await Promise.all(idx.pages.map(async p => {
    const j = await (await fetch('data/' + p.folder + '/page.json')).json();
    return j.blocks.filter(b => b.type !== 'heading').length ? p : null;
  }));
  pages = checks.filter(Boolean);
  nav.innerHTML = pages.map(p => {
    const top = !p.id.includes('/');
    return `<a class="${top ? 'sec' : 'sub'}" href="#${p.id}" data-id="${p.id}">${esc(p.title)}</a>`;
  }).join('');
  window.onhashchange = show;
  show();
}

async function show(){
  const id = decodeURIComponent(location.hash.slice(1)) || pages[0].id;
  const i = Math.max(0, pages.findIndex(p => p.id === id));
  const p = pages[i];
  const j = await (await fetch('data/' + p.folder + '/page.json')).json();
  const base = 'data/' + p.folder + '/';
  let html = '', first = true;
  for (const b of j.blocks) {
    if (b.type === 'heading') {
      html += first ? `<h1>${esc(b.text)}</h1>` : `<h2>${esc(b.text)}</h2>`;
      first = false;
    } else if (b.type === 'text') {
      if (!SKIP_TEXT.test(b.text.trim())) html += `<p>${esc(b.text)}</p>`;
    } else if (b.type === 'image') {
      html += `<div class="fig"><img src="${base + b.src}" alt=""></div>`;
    } else if (b.type === 'sprite' && b.w > 0 && b.h > 0) {
      html += `<img class="spr" src="${base + b.src}" width="${b.w}" height="${b.h}" alt="">`;
    }
  }
  if (first) html = `<h1>${esc(p.title)}</h1>` + html;
  const prev = pages[i-1], next = pages[i+1];
  html += `<div class="next"><span>${prev ? `<a href="#${prev.id}">&larr; ${esc(prev.title)}</a>` : ''}</span><span>${next ? `<a href="#${next.id}">${esc(next.title)} &rarr;</a>` : ''}</span></div>`;
  main.innerHTML = html;
  document.title = p.title + ' – Aegis Matrix Codex';
  nav.querySelectorAll('a').forEach(a => a.classList.toggle('on', a.dataset.id === p.id));
  nav.classList.remove('open'); menu.setAttribute('aria-expanded', false);
  window.scrollTo(0, 0);
}
init();
</script>
</body>
</html>
