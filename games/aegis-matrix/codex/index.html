<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aegis Matrix Codex</title>
<meta name="description" content="The in-game Codex for Aegis Matrix, a pixel-art space RTS by Spiceray Games.">
<link rel="stylesheet" href="/assets/site.css">
<style>
body{font-size:15px}
img{height:auto}
#menu{display:none;background:var(--panel);color:var(--accent);border:2px solid var(--line);font:inherit;padding:2px 10px;margin-left:auto}
.layout{display:grid;grid-template-columns:240px 1fr;max-width:1200px;margin:0 auto}
#nav{border-right:2px solid var(--line);padding:12px 0;max-height:100vh;overflow:auto;position:sticky;top:0;align-self:start}
#nav .sec{display:block;padding:6px 16px;color:var(--warm);text-decoration:none;text-transform:uppercase;letter-spacing:.08em;font-size:.85rem;margin-top:6px}
#nav .sub{display:block;padding:3px 16px 3px 28px;color:var(--text);text-decoration:none;font-size:.85rem}
#nav a:hover{color:var(--accent)}
#nav a.on{background:#141a36;color:var(--accent)}
#nav .sec.open{color:var(--accent)}
#page a.card.link{display:block;text-decoration:none;color:var(--text);cursor:pointer}
#page a.card.link:hover{border-color:var(--accent)}
#page a.card.link h3::after{content:" →";color:var(--accent)}
.back{display:inline-block;margin:4px 0 4px;text-decoration:none}
#page{padding:16px 24px 64px;min-width:0}
#page h1{color:var(--accent);text-transform:uppercase;letter-spacing:.12em;font-size:1.2rem;border-bottom:2px solid var(--line);padding-bottom:8px}
#page h2{color:var(--warm);font-size:1rem;margin:24px 0 6px;border:0;text-transform:none;letter-spacing:0;padding:0}
#page p{margin:6px 0;max-width:72ch}
.fig{background:var(--panel);border:2px solid var(--line);padding:12px;margin:12px 0;display:inline-block;max-width:100%}
.spr{display:inline-block;vertical-align:middle;margin:4px 8px 4px 0}
.cards,.stacks,.bonuses{display:grid;gap:12px;margin:12px 0}
.cards{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.stacks{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.bonuses{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
#page .card{padding:12px}
#page .card img{display:block;margin:0 auto 8px;max-height:128px;width:auto}
#page .card h3{margin:0 0 4px;font-size:.95rem}
#page .card p{margin:0;font-size:.85rem}
#page .stack{display:flex;gap:12px;align-items:flex-start}
#page .stack img{margin:0;width:48px;height:48px;flex:none}
.era{color:var(--dim);font-size:.75rem;text-transform:uppercase;margin-left:6px}
.tiers{color:var(--accent);font-size:.8rem;margin-bottom:4px}
.next{margin-top:32px;display:flex;justify-content:space-between;gap:12px;border-top:2px solid var(--line);padding-top:12px}
@media (max-width:760px){
 .layout{grid-template-columns:1fr}
 #menu{display:inline-block}
 #nav{display:none;position:static;max-height:none;border-right:0;border-bottom:2px solid var(--line)}
 #nav.open{display:block}
 #page{padding:12px 16px 48px}
}
</style>
</head>
<body>
<header class="top">
  <a class="studio" href="/">Spiceray Games</a>
  <nav><a href="/games/" class="on">Games</a><a href="/studio/">Studio</a></nav>
</header>
<div class="tabs"><div class="wrap">
  <span class="game">Aegis Matrix</span>
  <a class="tab" href="/games/aegis-matrix/">Home</a><a class="tab on" href="/games/aegis-matrix/codex/">Codex</a>
  <button id="menu" aria-expanded="false">Pages</button>
</div></div>
<div class="layout">
  <nav id="nav"></nav>
  <main id="page"><p>Loading…</p></main>
</div>
<footer>
  <p>Work in progress: details may change before release.</p>
  <p>Contact: <a href="mailto:hello@spiceraygames.com">hello@spiceraygames.com</a></p>
  <!-- OWNER: swap with OWNER in tools/build_pages.py -->
  <p>&copy; 2026 Wesley Adams. All rights reserved.</p>
</footer>
<script>
const SKIP_TEXT = /^(Not available yet\.*…?|BASIC|ADVANCED|EXPERIMENTAL)$/;
let pages = [];
const nav = document.getElementById('nav'), main = document.getElementById('page'), menu = document.getElementById('menu');
menu.onclick = () => { const o = nav.classList.toggle('open'); menu.setAttribute('aria-expanded', o); };

function esc(s){ return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

let sections = [], sectionOf = {};
async function init(){
  const idx = await (await fetch('data/index.json', {cache: 'no-cache'})).json();
  // Drop pages that are only a heading
  const keep = new Set((await Promise.all(idx.pages.map(async p => {
    const j = await (await fetch('data/' + p.folder + '/page.json', {cache: 'no-cache'})).json();
    return j.blocks.filter(b => b.type !== 'heading').length ? p.id : null;
  }))).filter(Boolean));
  sections = idx.nav.filter(s => keep.has(s.id)).map(s => ({...s, children: (s.children || []).filter(c => keep.has(c.id))}));
  pages = [];
  for (const s of sections) { pages.push(s); sectionOf[s.id] = s; for (const c of s.children) { pages.push(c); sectionOf[c.id] = s; } }
  window.onhashchange = show;
  show();
}

function drawNav(cur){
  const open = sectionOf[cur.id];
  nav.innerHTML = sections.map(s => {
    let h = `<a class="sec${s === open ? ' open' : ''}${s.id === cur.id ? ' on' : ''}" href="#${s.id}">${esc(s.title)}</a>`;
    if (s === open) h += s.children.map(c => `<a class="sub${c.id === cur.id ? ' on' : ''}" href="#${c.id}">${esc(c.title)}</a>`).join('');
    return h;
  }).join('');
}

async function show(){
  const id = decodeURIComponent(location.hash.slice(1)) || pages[0].id;
  const i = Math.max(0, pages.findIndex(p => p.id === id));
  const p = pages[i];
  const j = await (await fetch('data/' + p.folder + '/page.json', {cache: 'no-cache'})).json();
  const base = 'data/' + p.folder + '/';
  const sec = sectionOf[p.id];
  let html = sec && sec.id !== p.id ? `<a class="back" href="#${sec.id}">&lt; All ${esc(sec.title)}</a>` : '';
  let first = true, grid = null;
  const GRID = {card: 'cards', stack: 'stacks', bonus: 'bonuses'};
  for (const b of j.blocks) {
    const g = GRID[b.type] || null;
    if (grid !== g) { if (grid) html += '</div>'; if (g) html += `<div class="${g}">`; grid = g; }
    if (b.type === 'card') {
      const inner = `${b.src ? `<img src="${base + b.src}" alt="">` : ''}<h3>${esc(b.title)}</h3><p>${esc(b.text || '')}</p>`;
      html += b.link && sectionOf[b.link] ? `<a class="card link" href="#${b.link}">${inner}</a>` : `<div class="card">${inner}</div>`;
    } else if (b.type === 'stack') {
      html += `<div class="card stack">${b.src ? `<img src="${base + b.src}" alt="">` : ''}<div><h3>${esc(b.line)} <span class="era">${esc(b.era || '')}</span></h3><div class="tiers">${(b.techs || []).map(esc).join(' &rarr; ')}</div><p>${esc(b.text || '')}</p></div></div>`;
    } else if (b.type === 'bonus') {
      html += `<div class="card bonus"><h3>${esc(b.slot)}</h3><p>${esc(b.text)}</p></div>`;
    } else if (b.type === 'heading') {
      html += first ? `<h1>${esc(b.text)}</h1>` : `<h2>${esc(b.text)}</h2>`;
      first = false;
    } else if (b.type === 'text') {
      if (!SKIP_TEXT.test(b.text.trim())) html += b.text.split('\n').filter(s => s.trim()).map(s => `<p>${esc(s)}</p>`).join('');
    } else if (b.type === 'image') {
      html += `<div class="fig"><img src="${base + b.src}" alt=""></div>`;
    } else if (b.type === 'sprite' && b.w > 0 && b.h > 0) {
      html += `<img class="spr" src="${base + b.src}" width="${b.w}" height="${b.h}" alt="">`;
    }
  }
  if (grid) html += '</div>';
  if (first) html = html.replace(/^(<a class="back"[^>]*>.*?<\/a>)?/, m => m + `<h1>${esc(p.title)}</h1>`);
  const prev = pages[i-1], next = pages[i+1];
  html += `<div class="next"><span>${prev ? `<a href="#${prev.id}">&larr; ${esc(prev.title)}</a>` : ''}</span><span>${next ? `<a href="#${next.id}">${esc(next.title)} &rarr;</a>` : ''}</span></div>`;
  main.innerHTML = html;
  document.title = p.title + ' – Aegis Matrix Codex';
  drawNav(p);
  nav.classList.remove('open'); menu.setAttribute('aria-expanded', false);
  window.scrollTo(0, 0);
}
init();
</script>
</body>
</html>
